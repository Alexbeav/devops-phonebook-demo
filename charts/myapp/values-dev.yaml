nameOverride: myapp-dev
# Dev and prod isolate by NAMESPACE (myapp-dev / myapp-prod), not by resource
# names - workload names are fixed (myapp-backend etc.). Deploy with Helm
# release name 'myapp-dev' so the Bitnami subchart labels line up.
ingress:
  host: phonebook-dev.crosstalkis.com
  # IngressRoute mode: the homelab Traefik runs CRD-provider only (no standard
  # Ingress support); TLS comes from the cert-manager Certificate the chart
  # creates (letsencrypt-prod, DNS-01).
  useIngressRoute: true
  tls:
    enabled: true
  middlewares:
    - name: crowdsec-bouncer
      namespace: traefik
    - name: rate-limit
      namespace: traefik
    - name: security-headers
      namespace: traefik
monitoring:
  enabled: false
  release: prometheus
backend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/backend
  tag: "98a8457"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
frontend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/frontend
  tag: "304ea25"
  replicaCount: 1
  service:
    type: ClusterIP # Traefik fronts the app; no direct LoadBalancer exposure
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Database (PostgreSQL) configuration
# NOTE: password is set here for dev convenience only. For production, use existingSecret
# with SealedSecrets (see values-prod.yaml).
postgresql:
  enabled: true
  fullnameOverride: myapp-postgresql
  # Required by Bitnami's image-substitution guard when using the bitnamilegacy
  # mirror (their own archive registry) - see bitnami/charts#30850.
  global:
    security:
      allowInsecureImages: true
  # Versioned bitnami tags moved to the bitnamilegacy mirror (2025 catalog change)
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: myappuser
    password: myapppassword
    database: myappdb
  primary:
    # NetworkPolicy egress lockdown (templates/networkpolicy.yaml) selects on
    # this label so PostgreSQL is locked down too, not just the app pods.
    podLabels:
      app.kubernetes.io/part-of: devops-phonebook-demo
    networkPolicy:
      enabled: false # single authoritative policy lives in templates/networkpolicy.yaml
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ''
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 70
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
