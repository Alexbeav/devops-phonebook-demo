nameOverride: myapp-dev
# IMPORTANT: When deploying to dev, use Helm release name 'myapp-dev' (or Argo CD app name 'myapp-dev')
# This ensures all resources (including PostgreSQL service) are named correctly for the dev environment.
ingress:
  host: myapp-dev.example.com
  useIngressRoute: false # true switches to Traefik IngressRoute (also served by cert-manager)
  tls:
    enabled: true # requires cert-manager + a 'letsencrypt-prod' ClusterIssuer (see README)
monitoring:
  enabled: false
  release: prometheus
backend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/backend
  tag: "1d59818"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
frontend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/frontend
  tag: "193fd85"
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Database (PostgreSQL) configuration
# NOTE: password is set here for dev convenience only. For production, use existingSecret
# with SealedSecrets (see values-prod.yaml).
postgresql:
  enabled: true
  fullnameOverride: myapp-postgresql
  auth:
    username: myappuser
    password: myapppassword
    database: myappdb
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ''
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 70
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
