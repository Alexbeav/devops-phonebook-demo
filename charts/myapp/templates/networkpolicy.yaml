{{- if .Values.postgresql.enabled }}
# Single authoritative policy for PostgreSQL access. The Bitnami subchart's
# own NetworkPolicy is disabled in values (primary.networkPolicy.enabled=false)
# because policies are additive - its permissive allowExternal default would
# override this one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myapp-postgresql-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      # Bitnami labels pods with the Helm release name, not fullnameOverride
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: myapp-backend
        {{- if .Values.demoReset.enabled }}
        # the scheduled demo-reset job also needs the database
        - podSelector:
            matchLabels:
              app: myapp-demo-reset
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.monitoring.enabled }}
    # The postgres exporter is a sidecar in the PostgreSQL pod this policy
    # selects; without this rule kube-prometheus-stack could not scrape it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
    {{- end }}
{{- end }}
