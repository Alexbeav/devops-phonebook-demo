{{- if .Values.ingress.useIngressRoute }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "myapp.fullname" . }}-ingressroute
spec:
  entryPoints:
    {{- range .Values.ingress.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
    # Backend keeps its /api prefix - no stripPrefix middleware. The Express
    # routes are registered as /api/..., so stripping the prefix would 404.
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- range . }}
        - name: {{ .name }}
          {{- with .namespace }}
          namespace: {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      services:
        - name: myapp-backend
          port: 5000
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- range . }}
        - name: {{ .name }}
          {{- with .namespace }}
          namespace: {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      services:
        - name: myapp-frontend
          port: 80
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: myapp-tls
  {{- end }}
{{- if .Values.ingress.tls.enabled }}
---
# cert-manager provisions the myapp-tls secret referenced above; Traefik's
# built-in ACME is not used (2 replicas, no shared ACME storage).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "myapp.fullname" . }}-cert
spec:
  secretName: myapp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.host }}
{{- end }}
{{- end }}
