{{- if .Values.ingress.useIngressRoute }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "myapp.fullname" . }}-ingressroute
spec:
  entryPoints:
    {{- range .Values.ingress.entryPoints }}
    - {{ . }}
    {{- end }}
  {{- include "myapp.ingressRouteRoutes" (dict "host" .Values.ingress.host "middlewares" .Values.ingress.middlewares) | nindent 2 }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: myapp-tls
  {{- end }}
{{- with .Values.ingress.lan }}
---
# Optional second route for entrypoints that need a different middleware
# chain, for example a LAN entrypoint beside a tunnel-only one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "myapp.fullname" $ }}-ingressroute-lan
spec:
  entryPoints:
    {{- range .entryPoints }}
    - {{ . }}
    {{- end }}
  {{- include "myapp.ingressRouteRoutes" (dict "host" $.Values.ingress.host "middlewares" .middlewares) | nindent 2 }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    secretName: myapp-tls
  {{- end }}
{{- end }}
{{- if .Values.ingress.tls.enabled }}
---
# cert-manager provisions the myapp-tls secret referenced above; Traefik's
# built-in ACME is not used (2 replicas, no shared ACME storage).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "myapp.fullname" . }}-cert
spec:
  secretName: myapp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.host }}
{{- end }}
{{- end }}
