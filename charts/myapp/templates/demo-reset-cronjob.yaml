{{- if .Values.demoReset.enabled }}
# Public demo hygiene: restores known sample data on a schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: myapp-demo-reset
  labels:
    app: myapp-demo-reset
    app.kubernetes.io/part-of: devops-phonebook-demo
spec:
  schedule: {{ .Values.demoReset.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: myapp-demo-reset
            # NetworkPolicy egress lockdown selects on this label
            app.kubernetes.io/part-of: devops-phonebook-demo
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reset
              image: postgres:16
              securityContext:
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - psql
                - -v
                - ON_ERROR_STOP=1
                - -c
                - |
                  TRUNCATE contacts RESTART IDENTITY;
                  INSERT INTO contacts (name, phone, email) VALUES
                    ('Ada Lovelace', '+1 555-0101', 'ada@example.com'),
                    ('Grace Hopper', '+1 555-0102', 'grace@example.com'),
                    ('Margaret Hamilton', '+1 555-0103', 'margaret@example.com');
              env:
                - name: PGHOST
                  value: {{ .Values.postgresql.fullnameOverride | quote }}
                - name: PGUSER
                  value: {{ .Values.postgresql.auth.username | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgresql.auth.existingSecret | default .Values.postgresql.fullnameOverride }}
                      key: password
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
{{- end }}
