{{- if .Values.monitoring.enabled }}
# Discovered by kube-prometheus-stack via the release label (see README).
# The frontend has no metrics endpoint (nginx serving static files), so only
# the backend gets a ServiceMonitor; frontend availability is alerted on via
# kube-state-metrics (manifests/prometheus-alerts.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myapp-backend
  labels:
    release: {{ .Values.monitoring.release | default "prometheus" | quote }}
spec:
  selector:
    matchLabels:
      app: myapp-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
