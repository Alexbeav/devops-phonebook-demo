nameOverride: myapp-prod
ingress:
  host: phonebook.crosstalkis.com
  # IngressRoute mode: the homelab Traefik runs CRD-provider only (no standard
  # Ingress support); TLS comes from the cert-manager Certificate the chart
  # creates (letsencrypt-prod, DNS-01).
  useIngressRoute: true
  tls:
    enabled: true
  middlewares:
    - name: crowdsec-bouncer
      namespace: traefik
    - name: rate-limit
      namespace: traefik
    - name: security-headers
      namespace: traefik
# Public demo instance: application-enforced read-only mode plus a nightly
# reset to known harmless sample data (04:00 cluster time).
demoReset:
  enabled: true
  schedule: "0 4 * * *"
monitoring:
  enabled: true
  release: prometheus
backend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/backend
  tag: "98a8457"
  readOnly: true
  replicaCount: 3
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
frontend:
  image: ghcr.io/alexbeav/devops-phonebook-demo/frontend
  tag: "304ea25"
  replicaCount: 3
  service:
    type: ClusterIP # Traefik fronts the app; no direct LoadBalancer exposure
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Database (PostgreSQL) configuration
# IMPORTANT: For production, create a SealedSecret named 'myapp-db-credentials' with keys:
#   postgres-password, password
# See: docs/runbooks/database-connection.md and README for SealedSecrets setup
postgresql:
  enabled: true
  fullnameOverride: myapp-postgresql
  # Required by Bitnami's image-substitution guard when using the bitnamilegacy
  # mirror (their own archive registry) - see bitnami/charts#30850.
  global:
    security:
      allowInsecureImages: true
  # Versioned bitnami tags moved to the bitnamilegacy mirror (2025 catalog change)
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: myappuser
    database: myappdb
    existingSecret: myapp-db-credentials
  primary:
    # NetworkPolicy egress lockdown (templates/networkpolicy.yaml) selects on
    # this label so PostgreSQL is locked down too, not just the app pods.
    podLabels:
      app.kubernetes.io/part-of: devops-phonebook-demo
    networkPolicy:
      enabled: false # single authoritative policy lives in templates/networkpolicy.yaml
    persistence:
      enabled: true
      size: 32Gi
      storageClass: ''
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 70
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U myappuser -d myappdb -h 127.0.0.1
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/postgres-exporter
    serviceMonitor:
      enabled: true
      labels:
        # kube-prometheus-stack only discovers ServiceMonitors carrying its
        # release label; without this the exporter is never scraped.
        release: prometheus
