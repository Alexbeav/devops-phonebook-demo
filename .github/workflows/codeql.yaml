name: CodeQL

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, dev ] # dev deploys via ArgoCD, so it gets SAST too
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1' # weekly, catches newly added queries/CVE patterns

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
