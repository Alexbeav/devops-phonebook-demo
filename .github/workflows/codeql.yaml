name: CodeQL

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, dev ] # dev deploys via ArgoCD, so it gets SAST too
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1' # weekly, catches newly added queries/CVE patterns

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
