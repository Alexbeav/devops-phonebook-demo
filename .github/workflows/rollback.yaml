name: GitOps Rollback Application

permissions:
  contents: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - dev
          - prod
      backend_tag:
        description: 'Backend image tag to rollback to (short commit SHA)'
        required: true
        type: string
      frontend_tag:
        description: 'Frontend image tag to rollback to (short commit SHA)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    # Dispatch inputs are attacker-influenceable text: they reach shell only
    # through env vars, never inline ${{ }} interpolation, and are regex
    # validated before any use.
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BACKEND_TAG: ${{ inputs.backend_tag }}
      FRONTEND_TAG: ${{ inputs.frontend_tag }}
    steps:
      - name: Validate inputs and map environment to branch
        id: target
        run: |
          for tag in "$BACKEND_TAG" "$FRONTEND_TAG"; do
            if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::Tag '$tag' is not a lowercase hex commit SHA (7-40 chars)"
              exit 1
            fi
          done
          # Each ArgoCD app tracks its own branch: the rollback commit must
          # land on that branch or it silently never deploys.
          case "$ENVIRONMENT" in
            dev)  echo "branch=dev"  >> "$GITHUB_OUTPUT" ;;
            prod) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Validate image tags exist in GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          check_tag() {
            component="$1"
            tag="$2"
            token=$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}/${component}:pull" \
              | jq -er '.token')
            curl -fsS -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${repo}/${component}/tags/list" \
              | jq -er '.tags[]' | grep -Fxq "$tag" || {
                echo "::error::${component} tag '${tag}' not found in GHCR"
                return 1
              }
            echo "OK: ${component}:${tag} exists"
          }
          check_tag backend "$BACKEND_TAG"
          check_tag frontend "$FRONTEND_TAG"

      - name: Show yq version (preinstalled on ubuntu runners)
        run: yq --version

      - name: Rollback image tags in values file
        id: rollback
        run: |
          set -euo pipefail
          file="charts/myapp/values-${ENVIRONMENT}.yaml"
          current_backend=$(yq e '.backend.tag' "$file")
          current_frontend=$(yq e '.frontend.tag' "$file")
          echo "current_backend=$current_backend" >> "$GITHUB_OUTPUT"
          echo "current_frontend=$current_frontend" >> "$GITHUB_OUTPUT"
          echo "Rolling back ${ENVIRONMENT}: backend ${current_backend} -> ${BACKEND_TAG}, frontend ${current_frontend} -> ${FRONTEND_TAG}"
          yq e '.backend.tag = strenv(BACKEND_TAG)' -i "$file"
          yq e '.frontend.tag = strenv(FRONTEND_TAG)' -i "$file"

      - name: Commit and push rollback
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "charts/myapp/values-${ENVIRONMENT}.yaml"
          if git diff --staged --quiet; then
            echo "No changes - tags already match target versions"
            exit 0
          fi
          git commit -m "ci: rollback ${ENVIRONMENT} to backend:${BACKEND_TAG} frontend:${FRONTEND_TAG}"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Rollback committed to ${TARGET_BRANCH}; ArgoCD will sync it automatically"

      - name: Create rollback summary
        env:
          PREV_BACKEND: ${{ steps.rollback.outputs.current_backend }}
          PREV_FRONTEND: ${{ steps.rollback.outputs.current_frontend }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          {
            echo "## Rollback Summary"
            echo "| Component | Previous | New |"
            echo "|-----------|----------|-----|"
            echo "| Environment | - | \`${ENVIRONMENT}\` (branch \`${TARGET_BRANCH}\`) |"
            echo "| Backend | \`${PREV_BACKEND}\` | \`${BACKEND_TAG}\` |"
            echo "| Frontend | \`${PREV_FRONTEND}\` | \`${FRONTEND_TAG}\` |"
            echo ""
            echo "ArgoCD will detect the commit on \`${TARGET_BRANCH}\` and sync automatically."
          } >> "$GITHUB_STEP_SUMMARY"
