name: Secret Scanning

# Direct CLI invocation rather than gitleaks-action: the action downloads an
# unverified binary and picks its own commit range. Here the binary is
# version-pinned and checksum-verified, and the scanned range is explicit.
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history - the scan range below is --all

      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Self-test detector against a known positive
        run: |
          set -euo pipefail
          # Sample key assembled at runtime so this workflow file itself never
          # contains a contiguous secret-shaped string in git history.
          mkdir -p "$RUNNER_TEMP/selftest"
          printf 'aws_access_key_id = AKIA%s\n' "IOSFODNN7EXAMPLE" > "$RUNNER_TEMP/selftest/leak.txt"
          if ./gitleaks dir --no-banner "$RUNNER_TEMP/selftest"; then
            echo "::error::gitleaks did not detect a known-positive sample - defective release?"
            exit 1
          fi
          echo "Self-test OK: known positive detected"

      - name: Scan full git history
        run: ./gitleaks git --no-banner --redact --log-opts="--all" .
