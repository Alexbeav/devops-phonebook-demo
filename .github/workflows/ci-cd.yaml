name: CI/CD Pipeline

# GITHUB_TOKEN only - no PAT required. Making the GHCR packages public is a
# one-time manual step (see QUICKSTART), not something CI does on every build.
# The tag-update PR is created with GITHUB_TOKEN; such PRs don't retrigger CI,
# which is fine for values-only changes.
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Blocking CI validation: rendered manifests for both environments must
  # satisfy the Kyverno policies in policies/, and the policies must prove
  # they can block violations (negative-fixture self-tests). Upgrading this
  # to a required branch check is a documented opt-in (see TODO.md).
  policy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kyverno CLI 1.18.2 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz"
          echo "cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b  kyverno.tar.gz" | sha256sum -c -
          tar -xzf kyverno.tar.gz kyverno
          ./kyverno version

      - name: Policy self-tests (negative fixtures + no-match safeguard)
        run: ./kyverno test policies/

      - name: Validate rendered dev manifests
        run: |
          set -euo pipefail
          helm template myapp-dev charts/myapp -f charts/myapp/values-dev.yaml > /tmp/dev-render.yaml
          ./kyverno apply policies/require-resources.yaml policies/require-probes.yaml policies/disallow-latest-tag.yaml \
            --resource /tmp/dev-render.yaml

      - name: Validate rendered prod manifests
        run: |
          set -euo pipefail
          helm template myapp-prod charts/myapp -f charts/myapp/values-prod.yaml > /tmp/prod-render.yaml
          ./kyverno apply policies/require-resources.yaml policies/require-probes.yaml policies/disallow-latest-tag.yaml \
            --resource /tmp/prod-render.yaml

      - name: Verify production database privilege split
        run: |
          set -euo pipefail

          runtime_user=$(yq e 'select(.kind == "Deployment" and .metadata.name == "myapp-backend") | .spec.template.spec.containers[] | select(.name == "backend") | .env[] | select(.name == "DB_USER") | .value' /tmp/prod-render.yaml)
          runtime_secret=$(yq e 'select(.kind == "Deployment" and .metadata.name == "myapp-backend") | .spec.template.spec.containers[] | select(.name == "backend") | .env[] | select(.name == "DB_PASSWORD") | .valueFrom.secretKeyRef.name' /tmp/prod-render.yaml)
          migration_user=$(yq e 'select(.kind == "Deployment" and .metadata.name == "myapp-backend") | .spec.template.spec.initContainers[] | select(.name == "run-migrations") | .env[] | select(.name == "DB_USER") | .value' /tmp/prod-render.yaml)
          migration_secret=$(yq e 'select(.kind == "Deployment" and .metadata.name == "myapp-backend") | .spec.template.spec.initContainers[] | select(.name == "run-migrations") | .env[] | select(.name == "DB_PASSWORD") | .valueFrom.secretKeyRef.name' /tmp/prod-render.yaml)

          test "$runtime_user" = "myappreader"
          test "$runtime_secret" = "myapp-db-reader-credentials"
          test "$migration_user" = "myappuser"
          test "$migration_secret" = "myapp-db-credentials"

      - name: Verify production edge isolation settings
        run: |
          set -euo pipefail

          entrypoints=$(yq e 'select(.kind == "IngressRoute") | .spec.entryPoints[]' /tmp/prod-render.yaml | paste -sd, -)
          middlewares=$(yq e 'select(.kind == "IngressRoute") | .spec.routes[].middlewares[].name' /tmp/prod-render.yaml | sort -u | paste -sd, -)

          test "$entrypoints" = "websecure,websecure-cf"
          echo "$middlewares" | grep -Eq '(^|,)body-limit-phonebook(,|$)'
          echo "$middlewares" | grep -Eq '(^|,)crowdsec-bouncer-cloudflare(,|$)'
          echo "$middlewares" | grep -Eq '(^|,)csp-phonebook(,|$)'
          echo "$middlewares" | grep -Eq '(^|,)rate-limit-phonebook(,|$)'

  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag-update commits to dev
      packages: write        # image + attestation push to GHCR
      pull-requests: write   # prod tag-update PR
      id-token: write        # Sigstore signing for attestations
      attestations: write    # provenance + SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Compute image metadata
        id: meta
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect changed components
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="" # new branch or force-push baseline unknown: build everything
          else
            range="${BEFORE_SHA}..HEAD"
          fi
          if [ -z "$range" ]; then
            backend=true
            frontend=true
          else
            backend=$(git diff --name-only $range | grep -q '^apps/backend/' && echo true || echo false)
            frontend=$(git diff --name-only $range | grep -q '^apps/frontend/' && echo true || echo false)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Detected changes: backend=$backend frontend=$frontend"

      # Tests gate everything downstream - no '|| true'. The audit gate is
      # scoped to production dependencies: dev-chain advisories don't block,
      # runtime dependencies do (Trivy covers the built image layers).
      - name: Backend tests + audit
        working-directory: apps/backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Frontend tests + audit
        working-directory: apps/frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Build backend image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build -t ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }} ./apps/backend

      - name: Build frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker build -t ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }} ./apps/frontend

      # Per-build SBOM evidence (CycloneDX), generated for PRs and pushes alike
      # and retained 90 days; the workflow run timestamp is the date of record.
      - name: Generate backend SBOM
        if: steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }}
          format: 'cyclonedx'
          output: 'backend-sbom.cdx.json'

      - name: Generate frontend SBOM
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }}
          format: 'cyclonedx'
          output: 'frontend-sbom.cdx.json'

      - name: Upload backend SBOM artifact
        if: steps.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom-${{ steps.meta.outputs.sha }}
          path: backend-sbom.cdx.json
          retention-days: 90

      - name: Upload frontend SBOM artifact
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-sbom-${{ steps.meta.outputs.sha }}
          path: frontend-sbom.cdx.json
          retention-days: 90

      # Scan BEFORE any push: a vulnerable image must never reach the registry.
      - name: Trivy scan backend
        if: steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Everything below only runs for pushes - PRs build, test and scan, but
      # never publish images or touch values files.
      - name: Log in to GHCR
        if: github.event_name == 'push' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push backend image
        if: github.event_name == 'push' && steps.changes.outputs.backend == 'true'
        run: |
          docker tag ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }} ghcr.io/${{ steps.meta.outputs.repo }}/backend:latest
          docker push ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }}
          docker push ghcr.io/${{ steps.meta.outputs.repo }}/backend:latest

      - name: Push frontend image
        if: github.event_name == 'push' && steps.changes.outputs.frontend == 'true'
        run: |
          docker tag ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }} ghcr.io/${{ steps.meta.outputs.repo }}/frontend:latest
          docker push ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }}
          docker push ghcr.io/${{ steps.meta.outputs.repo }}/frontend:latest

      # Digests come from the registry, not local RepoDigests (unreliable after
      # a plain docker push), and are validated before any attestation is made.
      - name: Resolve backend image digest
        id: backend_digest
        if: github.event_name == 'push' && steps.changes.outputs.backend == 'true'
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.sha }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::Invalid digest '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve frontend image digest
        id: frontend_digest
        if: github.event_name == 'push' && steps.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ steps.meta.outputs.repo }}/frontend:${{ steps.meta.outputs.sha }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::Invalid digest '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signed SLSA build provenance + SBOM attestations, pushed to the
      # registry for OCI discovery (verify: gh attestation verify).
      # create-storage-record is org-only and defaults on - must be false here.
      - name: Attest backend provenance
        if: github.event_name == 'push' && steps.changes.outputs.backend == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}/backend
          subject-digest: ${{ steps.backend_digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest backend SBOM
        if: github.event_name == 'push' && steps.changes.outputs.backend == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}/backend
          subject-digest: ${{ steps.backend_digest.outputs.digest }}
          sbom-path: backend-sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest frontend provenance
        if: github.event_name == 'push' && steps.changes.outputs.frontend == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}/frontend
          subject-digest: ${{ steps.frontend_digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest frontend SBOM
        if: github.event_name == 'push' && steps.changes.outputs.frontend == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}/frontend
          subject-digest: ${{ steps.frontend_digest.outputs.digest }}
          sbom-path: frontend-sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Show yq version (preinstalled on ubuntu runners)
        if: github.event_name == 'push'
        run: yq --version

      # dev branch: commit the dev values bump straight to dev; ArgoCD's dev
      # app tracks the dev branch. Prod values are never touched from dev.
      - name: Update dev image tags and commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true')
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            yq e '.backend.tag = strenv(SHA)' -i charts/myapp/values-dev.yaml
          fi
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            yq e '.frontend.tag = strenv(SHA)' -i charts/myapp/values-dev.yaml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/myapp/values-dev.yaml
          git commit -m "ci: update dev image tags to ${SHA}" || echo "No changes"
          git push origin dev

      # main branch: prod values bump goes through a PR for review.
      - name: Update prod image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true')
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            yq e '.backend.tag = strenv(SHA)' -i charts/myapp/values-prod.yaml
          fi
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            yq e '.frontend.tag = strenv(SHA)' -i charts/myapp/values-prod.yaml
          fi

      - name: Create pull request for prod tag update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "ci: update prod image tags to ${{ steps.meta.outputs.sha }}"
          title: "ci: update prod image tags to ${{ steps.meta.outputs.sha }}"
          body: "Automated PR to roll prod to the images built from ${{ steps.meta.outputs.sha }}."
          branch: "ci/tag-update"
          add-paths: |
            charts/myapp/values-prod.yaml
