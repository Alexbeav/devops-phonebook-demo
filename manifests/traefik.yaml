apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 28.3.0
    helm:
      values: |
        deployment:
          kind: Deployment
          replicas: 2
        
        # Dashboard stays off: enabling it without an auth middleware exposes
        # the Traefik API to anyone who can reach the route.
        ingressRoute:
          dashboard:
            enabled: false
        
        service:
          type: LoadBalancer
        
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
        
        metrics:
          prometheus:
            enabled: true
            service:
              enabled: true
        
        logs:
          general:
            level: INFO
          access:
            enabled: true

        # TLS certificates come from cert-manager (see README). Traefik's
        # built-in ACME is deliberately not configured: with 2 replicas and
        # no shared storage it would race and lose certificates on restart.
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
