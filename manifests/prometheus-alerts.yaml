# Alert rules for the phonebook app. Requires kube-prometheus-stack installed
# as release 'prometheus' in namespace 'monitoring' (see README) - its
# defaults discover PrometheusRules across namespaces via the release label.
#
# Every expression is scoped to its exact namespace/deployment on BOTH the
# comparison and the absent() branch: series disappear when a Deployment is
# deleted or never scraped, so a bare comparison alone can never fire, and an
# unscoped absent() stays silent while another environment still emits a
# matching series.
#
# Dev only gets kube-state-metrics availability alerts: values-dev.yaml has
# monitoring.enabled=false (no ServiceMonitor, no postgres exporter), so
# scrape-health and database alerts exist only for prod.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myapp-alerts-prod
  namespace: myapp-prod
  labels:
    app: myapp
    environment: prod
    release: prometheus
spec:
  groups:
  - name: myapp-prod.rules
    rules:
    - alert: MyAppProdBackendDown
      expr: |
        kube_deployment_status_replicas_available{namespace="myapp-prod",deployment="myapp-backend"} < 1
          or absent(kube_deployment_status_replicas_available{namespace="myapp-prod",deployment="myapp-backend"})
      for: 1m
      labels:
        severity: critical
        environment: prod
        component: backend
      annotations:
        summary: "Prod backend has no available replicas"
        description: "No available backend replicas in myapp-prod for more than 1 minute (or the deployment is gone)."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/backend-down.md"

    - alert: MyAppProdFrontendDown
      expr: |
        kube_deployment_status_replicas_available{namespace="myapp-prod",deployment="myapp-frontend"} < 1
          or absent(kube_deployment_status_replicas_available{namespace="myapp-prod",deployment="myapp-frontend"})
      for: 1m
      labels:
        severity: critical
        environment: prod
        component: frontend
      annotations:
        summary: "Prod frontend has no available replicas"
        description: "No available frontend replicas in myapp-prod for more than 1 minute (or the deployment is gone)."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/frontend-down.md"

    - alert: MyAppProdBackendScrapeDown
      expr: |
        up{job="myapp-backend",namespace="myapp-prod"} == 0
          or absent(up{job="myapp-backend",namespace="myapp-prod"})
      for: 2m
      labels:
        severity: warning
        environment: prod
        component: backend
      annotations:
        summary: "Prod backend metrics scrape failing"
        description: "Prometheus cannot scrape the backend /metrics endpoint in myapp-prod (target down or never discovered)."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/backend-down.md"

    - alert: MyAppProdDatabaseDown
      expr: |
        postgresql_up{namespace="myapp-prod"} == 0
          or absent(postgresql_up{namespace="myapp-prod"})
      for: 1m
      labels:
        severity: critical
        environment: prod
        component: database
      annotations:
        summary: "Prod PostgreSQL is down or unmonitored"
        description: "The postgres exporter in myapp-prod reports the database down, or its metrics are absent."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/database-connection.md"

    - alert: MyAppProdHighMemoryUsage
      expr: |
        (
          container_memory_working_set_bytes{namespace="myapp-prod",pod=~"myapp-.*",container!="POD",container!=""}
          /
          container_spec_memory_limit_bytes{namespace="myapp-prod",pod=~"myapp-.*",container!="POD",container!=""}
        ) > 0.8
      for: 5m
      labels:
        severity: warning
        environment: prod
      annotations:
        summary: "High memory usage on prod pods"
        description: "Pod {{ $labels.pod }} has used more than 80% of its memory limit for 5 minutes ({{ $value | humanizePercentage }})."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/high-memory.md"

    - alert: MyAppProdHighCPUUsage
      expr: |
        (
          rate(container_cpu_usage_seconds_total{namespace="myapp-prod",pod=~"myapp-.*",container!="POD",container!=""}[5m])
          /
          container_spec_cpu_quota{namespace="myapp-prod",pod=~"myapp-.*",container!="POD",container!=""}
          * container_spec_cpu_period{namespace="myapp-prod",pod=~"myapp-.*",container!="POD",container!=""}
        ) > 0.8
      for: 5m
      labels:
        severity: warning
        environment: prod
      annotations:
        summary: "High CPU usage on prod pods"
        description: "Pod {{ $labels.pod }} has used more than 80% of its CPU limit for 5 minutes ({{ $value | humanizePercentage }})."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/high-cpu.md"

    - alert: MyAppProdPodRestartingFrequently
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="myapp-prod",pod=~"myapp-.*"}[15m]) > 2
      for: 5m
      labels:
        severity: warning
        environment: prod
      annotations:
        summary: "Prod pod restarting frequently"
        description: "Pod {{ $labels.pod }} restarted {{ $value }} times in the last 15 minutes."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/pod-restarts.md"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myapp-alerts-dev
  namespace: myapp-dev
  labels:
    app: myapp
    environment: dev
    release: prometheus
spec:
  groups:
  - name: myapp-dev.rules
    rules:
    - alert: MyAppDevBackendDown
      expr: |
        kube_deployment_status_replicas_available{namespace="myapp-dev",deployment="myapp-backend"} < 1
          or absent(kube_deployment_status_replicas_available{namespace="myapp-dev",deployment="myapp-backend"})
      for: 3m
      labels:
        severity: warning
        environment: dev
        component: backend
      annotations:
        summary: "Dev backend has no available replicas"
        description: "No available backend replicas in myapp-dev for more than 3 minutes (or the deployment is gone)."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/backend-down.md"

    - alert: MyAppDevFrontendDown
      expr: |
        kube_deployment_status_replicas_available{namespace="myapp-dev",deployment="myapp-frontend"} < 1
          or absent(kube_deployment_status_replicas_available{namespace="myapp-dev",deployment="myapp-frontend"})
      for: 3m
      labels:
        severity: warning
        environment: dev
        component: frontend
      annotations:
        summary: "Dev frontend has no available replicas"
        description: "No available frontend replicas in myapp-dev for more than 3 minutes (or the deployment is gone)."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/frontend-down.md"

    - alert: MyAppDevPodRestartingFrequently
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="myapp-dev",pod=~"myapp-.*"}[15m]) > 2
      for: 10m
      labels:
        severity: warning
        environment: dev
      annotations:
        summary: "Dev pod restarting frequently"
        description: "Pod {{ $labels.pod }} restarted {{ $value }} times in the last 15 minutes."
        runbook_url: "https://github.com/Alexbeav/devops-phonebook-demo/blob/main/docs/runbooks/pod-restarts.md"
